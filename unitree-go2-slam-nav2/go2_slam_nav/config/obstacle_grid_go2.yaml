# Project RTAB-Map /cloud_obstacles onto /map -> /map_obstacles

obstacle_grid_projector:
  ros__parameters:
    map_topic: /map
    cloud_obstacles_topic: /cloud_obstacles
    output_topic: /map_obstacles
    output_updates_topic: /map_obstacles_updates
    min_obstacle_height: 0.04
    max_obstacle_height: 1.5
    obstacle_value: 100
    # 栅格分辨率 0.05m，1 格 = 5cm 障碍膨胀（探索直接用 /map_obstacles）
    inflate_cells: 1
    publish_rate: 5.0
    max_cloud_points: 25000